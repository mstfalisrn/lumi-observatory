# LUMI Agentic Observatory — Docker Compose (pinned, standalone)
# Only lumi-gateway binds to the host on 127.0.0.1:${GATEWAY_PORT:-3525}.
# PostgreSQL/Redis are not exposed to the host (internal network). Web UI is baked into the API image (single origin).
name: lumi-observatory

services:
  # ------------------------------------------------------ PostgreSQL 16 + pgvector
  lumi-postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: lumi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lumi}
    volumes:
      - lumi_pgdata:/var/lib/postgresql/data
      - ./infra/compose/initdb/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumi}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    expose: ["5432"]
    # Host-side services (lumi-earn, lumi-kibble) run outside this network and
    # write to the llm_usage ledger, so the port is published on loopback only.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    networks: [lumi_internal]

  # ------------------------------------------------------ Redis 7
  lumi-redis:
    image: redis:7.2-alpine@sha256:ccd6aa8d45ff3f033d6fa15b8cc1a50579f65c89f38cf9bb607a954c4f2128ed
    container_name: lumi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - lumi_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    expose: ["6379"]
    networks: [lumi_internal]

  # ------------------------------------------------------ One-shot migration (API does not run migrations)
  lumi-migrate:
    build:
      context: .
      dockerfile: apps/migrate/Dockerfile
      args:
        PYTHON_IMAGE: python:3.12-slim@sha256:7a8b475003c4fe15a2cd4e55e5cfc2f3560bdc9333d624f24cdd6d4340fd7a17
    container_name: lumi-migrate
    restart: "no"
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD}@lumi-postgres:5432/${POSTGRES_DB:-lumi}
    depends_on:
      lumi-postgres: { condition: service_healthy }
    networks: [lumi_internal]

  # ------------------------------------------------------ API + SSE + webhook + (embedded static UI)
  lumi-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PYTHON_IMAGE: python:3.12-slim@sha256:7a8b475003c4fe15a2cd4e55e5cfc2f3560bdc9333d624f24cdd6d4340fd7a17
    container_name: lumi-api
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD}@lumi-postgres:5432/${POSTGRES_DB:-lumi}
      REDIS_URL: redis://lumi-redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      SESSION_ENCRYPTION_MASTER_KEY: ${SESSION_ENCRYPTION_MASTER_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_GROUP_ENABLED: ${TELEGRAM_GROUP_ENABLED:-false}
      # tclk audit policy — the panel must show these values the same as the Scheduler
      TCLK_AGENT_AUDIT_ENABLED: ${TCLK_AGENT_AUDIT_ENABLED:-true}
      TCLK_AGENT_ACCEPT_SPECLESS: ${TCLK_AGENT_ACCEPT_SPECLESS:-false}
      TCLK_ACCEPT_REQUIRE_BRIEF: ${TCLK_ACCEPT_REQUIRE_BRIEF:-true}
      TCLK_AGENT_MIN_TIER: ${TCLK_AGENT_MIN_TIER:-safe}
      TCLK_AGENT_ACCEPT_PER_HOUR: ${TCLK_AGENT_ACCEPT_PER_HOUR:-6}
      TCLK_AGENT_VALIDATION_RESERVE: ${TCLK_AGENT_VALIDATION_RESERVE:-0}
      TCLK_AGENT_PRODUCE: ${TCLK_AGENT_PRODUCE:-true}
      TCLK_PRODUCE_PER_HOUR: ${TCLK_PRODUCE_PER_HOUR:-6}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai/v1}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_EVAL_PATH: ${JEV_EVAL_PATH:-/systemone}
      JEV_COST_PER_MTOK_INPUT: ${JEV_COST_PER_MTOK_INPUT:-0.042}
      JEV_COST_PER_MTOK_OUTPUT: ${JEV_COST_PER_MTOK_OUTPUT:-0.0}
      JEV_ALLOWED_HOSTS: ${JEV_ALLOWED_HOSTS:-api.typesafe.ai}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-15}
      JEV_AUTO_THRESHOLD: ${JEV_AUTO_THRESHOLD:-0.90}
      JEV_REVIEW_THRESHOLD: ${JEV_REVIEW_THRESHOLD:-0.60}
      JEV_MAX_CALLS_PER_MINUTE: ${JEV_MAX_CALLS_PER_MINUTE:-24}
      JEV_DAILY_CALL_CAP: ${JEV_DAILY_CALL_CAP:-20000}
      JEV_BACKOFF_SECONDS: ${JEV_BACKOFF_SECONDS:-45}
      JEV_EVALUATOR_MAX_CALLS_PER_MINUTE: ${JEV_EVALUATOR_MAX_CALLS_PER_MINUTE:-12}
      JEV_EVALUATOR_MIN_TIER: ${JEV_EVALUATOR_MIN_TIER:-WATCH}
      JEV_EVALUATOR_SAMPLE_N: ${JEV_EVALUATOR_SAMPLE_N:-40}
      JEV_EVALUATOR_ENABLED: ${JEV_EVALUATOR_ENABLED:-false}
      JEV_POLICY_ENABLED: ${JEV_POLICY_ENABLED:-false}
      JEV_TCLK_ENABLED: ${JEV_TCLK_ENABLED:-false}
      JEV_TCLK_REQUIRE_LEGIT: ${JEV_TCLK_REQUIRE_LEGIT:-true}
      JEV_POLICY_TOOLS: ${JEV_POLICY_TOOLS:-technocore_read,github_repo_read,http_json_read,internal_health,db_self_write}
      JEV_POLICY_REVIEW_THRESHOLD: ${JEV_POLICY_REVIEW_THRESHOLD:-0.50}
      JEV_ESCALATE_TO_LLM: ${JEV_ESCALATE_TO_LLM:-true}
      LLM_SESSION_ID: ${LLM_SESSION_ID:-}
      LLM_USER_AGENT: ${LLM_USER_AGENT:-}
      RUN_MAX_ITERATIONS: ${RUN_MAX_ITERATIONS:-40}
      RUN_MAX_WALL_SECONDS: ${RUN_MAX_WALL_SECONDS:-900}
      RUN_MAX_TOKEN_BUDGET: ${RUN_MAX_TOKEN_BUDGET:-200000}
      RUN_MAX_COST_BUDGET: ${RUN_MAX_COST_BUDGET:-5.0}
      TECHNOCORE_ENABLED: ${TECHNOCORE_ENABLED:-false}
      TECHNOCORE_BASE_URL: ${TECHNOCORE_BASE_URL:-}
      CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-}
      SOURCE_MONITOR_ENABLED: ${SOURCE_MONITOR_ENABLED:-false}
      SOURCE_MONITOR_MAX_PER_TICK: ${SOURCE_MONITOR_MAX_PER_TICK:-10}
      SOURCE_MEMORY_CANDIDATES_ENABLED: ${SOURCE_MEMORY_CANDIDATES_ENABLED:-true}
      SOURCE_MEMORY_TTL_SECONDS: ${SOURCE_MEMORY_TTL_SECONDS:-604800}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-false}
      DIGEST_MAX_SCHEDULES_PER_TICK: ${DIGEST_MAX_SCHEDULES_PER_TICK:-10}
      DIGEST_DELIVERY_ENABLED: ${DIGEST_DELIVERY_ENABLED:-false}
      RISK_ALERTS_ENABLED: ${RISK_ALERTS_ENABLED:-false}
    depends_on:
      lumi-migrate: { condition: service_completed_successfully }
      lumi-postgres: { condition: service_healthy }
      lumi-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [lumi_internal]

  # ------------------------------------------------------ Gateway (Caddy) — single host bind
  lumi-gateway:
    image: caddy:2.8@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    container_name: lumi-gateway
    restart: unless-stopped
    user: "0:0"
    security_opt: ["no-new-privileges:true"]
    cap_add: ["NET_BIND_SERVICE"]
    cap_drop: ["ALL"]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3525}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      lumi-api: { condition: service_healthy }
    networks: [lumi_internal]

  # ------------------------------------------------------ Worker (agent run execution)
  lumi-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: lumi-worker
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Technocore DID key (host) → read-only into container; must be readable by UID 10001 on host (0640 root:10001)
      - ${TECHNOCORE_KEY_HOST_PATH:-./secrets/did.ed25519}:/run/secrets/technocore/did.ed25519:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD}@lumi-postgres:5432/${POSTGRES_DB:-lumi}
      REDIS_URL: redis://lumi-redis:6379/0
      SESSION_ENCRYPTION_MASTER_KEY: ${SESSION_ENCRYPTION_MASTER_KEY}
      TCLK_AGENT_AUDIT_ENABLED: ${TCLK_AGENT_AUDIT_ENABLED:-true}
      TCLK_AGENT_ACCEPT_SPECLESS: ${TCLK_AGENT_ACCEPT_SPECLESS:-false}
      TCLK_ACCEPT_REQUIRE_BRIEF: ${TCLK_ACCEPT_REQUIRE_BRIEF:-true}
      TCLK_AGENT_MIN_TIER: ${TCLK_AGENT_MIN_TIER:-safe}
      TCLK_AGENT_ACCEPT_PER_HOUR: ${TCLK_AGENT_ACCEPT_PER_HOUR:-6}
      TCLK_AGENT_VALIDATION_RESERVE: ${TCLK_AGENT_VALIDATION_RESERVE:-0}
      TCLK_AGENT_PRODUCE: ${TCLK_AGENT_PRODUCE:-true}
      TCLK_PRODUCE_PER_HOUR: ${TCLK_PRODUCE_PER_HOUR:-6}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai/v1}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_EVAL_PATH: ${JEV_EVAL_PATH:-/systemone}
      JEV_COST_PER_MTOK_INPUT: ${JEV_COST_PER_MTOK_INPUT:-0.042}
      JEV_COST_PER_MTOK_OUTPUT: ${JEV_COST_PER_MTOK_OUTPUT:-0.0}
      JEV_ALLOWED_HOSTS: ${JEV_ALLOWED_HOSTS:-api.typesafe.ai}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-15}
      JEV_AUTO_THRESHOLD: ${JEV_AUTO_THRESHOLD:-0.90}
      JEV_REVIEW_THRESHOLD: ${JEV_REVIEW_THRESHOLD:-0.60}
      JEV_MAX_CALLS_PER_MINUTE: ${JEV_MAX_CALLS_PER_MINUTE:-24}
      JEV_DAILY_CALL_CAP: ${JEV_DAILY_CALL_CAP:-20000}
      JEV_BACKOFF_SECONDS: ${JEV_BACKOFF_SECONDS:-45}
      JEV_EVALUATOR_MAX_CALLS_PER_MINUTE: ${JEV_EVALUATOR_MAX_CALLS_PER_MINUTE:-12}
      JEV_EVALUATOR_MIN_TIER: ${JEV_EVALUATOR_MIN_TIER:-WATCH}
      JEV_EVALUATOR_SAMPLE_N: ${JEV_EVALUATOR_SAMPLE_N:-40}
      JEV_EVALUATOR_ENABLED: ${JEV_EVALUATOR_ENABLED:-false}
      JEV_POLICY_ENABLED: ${JEV_POLICY_ENABLED:-false}
      JEV_TCLK_ENABLED: ${JEV_TCLK_ENABLED:-false}
      JEV_TCLK_REQUIRE_LEGIT: ${JEV_TCLK_REQUIRE_LEGIT:-true}
      JEV_POLICY_TOOLS: ${JEV_POLICY_TOOLS:-technocore_read,github_repo_read,http_json_read,internal_health,db_self_write}
      JEV_POLICY_REVIEW_THRESHOLD: ${JEV_POLICY_REVIEW_THRESHOLD:-0.50}
      JEV_ESCALATE_TO_LLM: ${JEV_ESCALATE_TO_LLM:-true}
      LLM_SESSION_ID: ${LLM_SESSION_ID:-}
      LLM_USER_AGENT: ${LLM_USER_AGENT:-}
      RUN_MAX_ITERATIONS: ${RUN_MAX_ITERATIONS:-40}
      RUN_MAX_TOOL_CALLS: ${RUN_MAX_TOOL_CALLS:-80}
      RUN_MAX_WALL_SECONDS: ${RUN_MAX_WALL_SECONDS:-900}
      CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-}
      TECHNOCORE_ENABLED: ${TECHNOCORE_ENABLED:-false}
      TECHNOCORE_BASE_URL: ${TECHNOCORE_BASE_URL:-}
      TECHNOCORE_ED25519_KEY_PATH: /run/secrets/technocore/did.ed25519
    depends_on:
      lumi-migrate: { condition: service_completed_successfully }
      lumi-postgres: { condition: service_healthy }
      lumi-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [lumi_internal]

  # ------------------------------------------------------ Scheduler
  lumi-scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    container_name: lumi-scheduler
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      # Technocore DID key (host) → read-only into container; must be readable by UID 10001 on host (0640 root:10001)
      - ${TECHNOCORE_KEY_HOST_PATH:-./secrets/did.ed25519}:/run/secrets/technocore/did.ed25519:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD}@lumi-postgres:5432/${POSTGRES_DB:-lumi}
      REDIS_URL: redis://lumi-redis:6379/0
      SESSION_ENCRYPTION_MASTER_KEY: ${SESSION_ENCRYPTION_MASTER_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_GROUP_ENABLED: ${TELEGRAM_GROUP_ENABLED:-false}
      TECHNOCORE_ENABLED: ${TECHNOCORE_ENABLED:-false}
      TECHNOCORE_BASE_URL: ${TECHNOCORE_BASE_URL:-}
      TECHNOCORE_MONITORED_ROOMS: ${TECHNOCORE_MONITORED_ROOMS:-}
      TECHNOCORE_ROOM_REACT_ENABLED: ${TECHNOCORE_ROOM_REACT_ENABLED:-false}
      TECHNOCORE_ROOM_REACT_INTERVAL: ${TECHNOCORE_ROOM_REACT_INTERVAL:-300}
      TECHNOCORE_ED25519_KEY_PATH: /run/secrets/technocore/did.ed25519
      TCLK_ENABLED: ${TCLK_ENABLED:-false}
      TCLK_MONITOR_ROOMS: ${TCLK_MONITOR_ROOMS:-tclk-offers,d-blockrewards-feed}
      TCLK_AGENT_ENABLED: ${TCLK_AGENT_ENABLED:-false}
      TCLK_AGENT_MAX_AMOUNT: ${TCLK_AGENT_MAX_AMOUNT:-1000000}
      TCLK_AGENT_RAILS: ${TCLK_AGENT_RAILS:-flop-htlc}
      TCLK_AGENT_MAX_ACTIVE: ${TCLK_AGENT_MAX_ACTIVE:-2}
      TCLK_AGENT_ACTIVE_TTL: ${TCLK_AGENT_ACTIVE_TTL:-1800}
      TCLK_AGENT_TASK_PATTERNS: ${TCLK_AGENT_TASK_PATTERNS:-math,verification,inference,documentation,attest,protocol,probe,echo,scan,digest,report,summary,stats,read,observe,a2a,blockrewards,pin,kibble,acp}
      TCLK_AGENT_MAX_DIFFICULTY: ${TCLK_AGENT_MAX_DIFFICULTY:-3}
      TCLK_AGENT_AUDIT_ENABLED: ${TCLK_AGENT_AUDIT_ENABLED:-true}
      TCLK_AGENT_ACCEPT_SPECLESS: ${TCLK_AGENT_ACCEPT_SPECLESS:-false}
      TCLK_ACCEPT_REQUIRE_BRIEF: ${TCLK_ACCEPT_REQUIRE_BRIEF:-true}
      TCLK_AGENT_MIN_TIER: ${TCLK_AGENT_MIN_TIER:-safe}
      TCLK_AGENT_ACCEPT_PER_HOUR: ${TCLK_AGENT_ACCEPT_PER_HOUR:-6}
      TCLK_AGENT_VALIDATION_RESERVE: ${TCLK_AGENT_VALIDATION_RESERVE:-0}
      TCLK_AGENT_PRODUCE: ${TCLK_AGENT_PRODUCE:-true}
      TCLK_PRODUCE_PER_HOUR: ${TCLK_PRODUCE_PER_HOUR:-6}
      TCLK_CLAIM_RADAR_ENABLED: ${TCLK_CLAIM_RADAR_ENABLED:-true}
      # Room where an offer's `job` marker resolves to a real brief.
      TCLK_JOB_ROOM: ${TCLK_JOB_ROOM:-kibble}
      # So token accounting shows who burns these calls (llm_usage.service).
      LUMI_SERVICE: lumi-scheduler
      EVALUATOR_LLM_ENABLED: ${EVALUATOR_LLM_ENABLED:-true}
      CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-}
      SOURCE_MONITOR_ENABLED: ${SOURCE_MONITOR_ENABLED:-false}
      SOURCE_MONITOR_MAX_PER_TICK: ${SOURCE_MONITOR_MAX_PER_TICK:-10}
      SOURCE_MEMORY_CANDIDATES_ENABLED: ${SOURCE_MEMORY_CANDIDATES_ENABLED:-true}
      SOURCE_MEMORY_TTL_SECONDS: ${SOURCE_MEMORY_TTL_SECONDS:-604800}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-false}
      DIGEST_MAX_SCHEDULES_PER_TICK: ${DIGEST_MAX_SCHEDULES_PER_TICK:-10}
      DIGEST_DELIVERY_ENABLED: ${DIGEST_DELIVERY_ENABLED:-false}
      RISK_ALERTS_ENABLED: ${RISK_ALERTS_ENABLED:-false}
      MEMORY_AUTO_PROMOTE_THRESHOLD: ${MEMORY_AUTO_PROMOTE_THRESHOLD:-0.85}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai/v1}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_EVAL_PATH: ${JEV_EVAL_PATH:-/systemone}
      JEV_COST_PER_MTOK_INPUT: ${JEV_COST_PER_MTOK_INPUT:-0.042}
      JEV_COST_PER_MTOK_OUTPUT: ${JEV_COST_PER_MTOK_OUTPUT:-0.0}
      JEV_ALLOWED_HOSTS: ${JEV_ALLOWED_HOSTS:-api.typesafe.ai}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-15}
      JEV_AUTO_THRESHOLD: ${JEV_AUTO_THRESHOLD:-0.90}
      JEV_REVIEW_THRESHOLD: ${JEV_REVIEW_THRESHOLD:-0.60}
      JEV_MAX_CALLS_PER_MINUTE: ${JEV_MAX_CALLS_PER_MINUTE:-24}
      JEV_DAILY_CALL_CAP: ${JEV_DAILY_CALL_CAP:-20000}
      JEV_BACKOFF_SECONDS: ${JEV_BACKOFF_SECONDS:-45}
      JEV_EVALUATOR_MAX_CALLS_PER_MINUTE: ${JEV_EVALUATOR_MAX_CALLS_PER_MINUTE:-12}
      JEV_EVALUATOR_MIN_TIER: ${JEV_EVALUATOR_MIN_TIER:-WATCH}
      JEV_EVALUATOR_SAMPLE_N: ${JEV_EVALUATOR_SAMPLE_N:-40}
      JEV_EVALUATOR_ENABLED: ${JEV_EVALUATOR_ENABLED:-false}
      JEV_POLICY_ENABLED: ${JEV_POLICY_ENABLED:-false}
      JEV_TCLK_ENABLED: ${JEV_TCLK_ENABLED:-false}
      JEV_TCLK_REQUIRE_LEGIT: ${JEV_TCLK_REQUIRE_LEGIT:-true}
      JEV_POLICY_TOOLS: ${JEV_POLICY_TOOLS:-technocore_read,github_repo_read,http_json_read,internal_health,db_self_write}
      JEV_POLICY_REVIEW_THRESHOLD: ${JEV_POLICY_REVIEW_THRESHOLD:-0.50}
      JEV_ESCALATE_TO_LLM: ${JEV_ESCALATE_TO_LLM:-true}
      LLM_SESSION_ID: ${LLM_SESSION_ID:-}
      LLM_USER_AGENT: ${LLM_USER_AGENT:-}
    depends_on:
      lumi-migrate: { condition: service_completed_successfully }
      lumi-postgres: { condition: service_healthy }
      lumi-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [lumi_internal]

  # ------------------------------------------------------ Live log (read-only)
  # Answers "what is it doing" on one readable page: LLM decisions and Jev
  # decisions in separate sections. Runs SELECT only.
  lumi-logs:
    build:
      context: .
      dockerfile: apps/logs/Dockerfile
    container_name: lumi-logs
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lumi}
      POSTGRES_HOST: lumi-postgres
      LOGS_PORT: "8000"
      LOGS_REFRESH_SECONDS: ${LOGS_REFRESH_SECONDS:-20}
      LOGS_ROWS: ${LOGS_ROWS:-25}
      # dashboard access token (required once the service is published through
      # a tunnel) and the read-only DSN it should use instead of the owner role
      LOGS_AUTH_TOKEN: ${LOGS_AUTH_TOKEN:-}
      LOGS_DATABASE_URL: ${LOGS_DATABASE_URL:-}
    ports:
      - "127.0.0.1:${LOGS_PORT_HOST:-3590}:8000"
    depends_on:
      lumi-postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [lumi_internal]

volumes:
  lumi_pgdata:
    driver: local
  lumi_redisdata:
    driver: local

networks:
  lumi_internal:
    driver: bridge
    internal: false   # connectors need internet access; only host ports are closed
